name: Release to Closed Testing (Alpha)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (optional, defaults to latest)'
        required: false
        type: string
      auto_approve:
        description: 'Auto-release (for testing)'
        required: false
        default: false
        type: boolean

jobs:
  release-to-closed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Get version to release
        id: get-version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            # Get latest version tag
            VERSION=$(git tag -l "v*" --sort=-version:refname | sed 's/^v//' | head -1)
          fi
          
          echo "Releasing version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
          # Validate version format
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version format: $VERSION"
            echo "Expected format: X.Y.Z (e.g., 1.0.94)"
            exit 1
          fi

      - name: Find and download release artifacts
        id: download-artifacts
        run: |
          VERSION="${{ steps.get-version.outputs.version }}"
          
          # Find the release workflow run
          WORKFLOW_RUN=$(gh run list --workflow="Build and Release Android App" --branch="main" --limit=10 --json databaseId,headBranch,status,conclusion --jq '.[] | select(.headBranch == "main" and .status == "completed") | .databaseId' | head -1)
          
          if [ -n "$WORKFLOW_RUN" ]; then
            echo "Found workflow run: $WORKFLOW_RUN"
            echo "workflow_run_id=$WORKFLOW_RUN" >> $GITHUB_OUTPUT
          else
            echo "No completed release workflow found"
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download AAB artifact
        uses: dawidd6/action-download-artifact@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          run_id: ${{ steps.download-artifacts.outputs.workflow_run_id }}
          name: release-aab
          path: ./release

      - name: Verify downloaded AAB
        run: |
          echo "Downloaded files:"
          ls -la ./release/
          
          if [ ! -f "./release/*.aab" ]; then
            echo "No AAB file found in release artifacts"
            exit 1
          fi
          
          echo "AAB file found successfully"

      - name: Create release notes
        run: |
          VERSION="${{ steps.get-version.outputs.version }}"
          mkdir -p whatsnew
          printf 'Version %s\n\nReleased to Closed Testing for internal validation.\n\nChanges:\n- Stability improvements\n- Bug fixes\n- Performance optimizations\n' "$VERSION" > whatsnew/whatsnew-en-US

      - name: Release to Closed Testing (Alpha)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.pypyradio.aacplayer
          releaseFiles: "./release/*.aab"
          track: internal
          status: completed
          releaseName: "${{ steps.get-version.outputs.version }} - Closed Testing"
          whatsNewDirectory: whatsnew

      - name: Create release tracking issue
        run: |
          VERSION="${{ steps.get-version.outputs.version }}"
          
          ISSUE_BODY="## Closed Testing Release: v$VERSION
          
          **Version:** v$VERSION
          **Track:** Closed Testing (Alpha)
          **Rollout:** 100%
          **Released by:** ${{ github.actor }}
          **Released at:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          
          ---
          
          ### Internal Testing Checklist
          - [ ] Basic functionality verified
          - [ ] Android Auto compatibility tested
          - [ ] Performance metrics checked
          - [ ] Crash rate monitored (24 hours)
          - [ ] User feedback collected
          - [ ] Ready for Beta promotion
          
          ---
          
          ### Next Steps
          Once validated in closed testing, promote to:
          1. **Beta Track** - Use 'Promote Release with Approval' workflow
          2. **Production Track** - Use 'Promote Release with Approval' workflow
          
          ### Promotion Commands
          ```bash
          # To promote to Beta
          gh workflow run 'Promote Release with Approval' --field track=beta --field version=$VERSION
          
          # To promote to Production
          gh workflow run 'Promote Release with Approval' --field track=production --field version=$VERSION
          ```
          "
          
          # Create tracking issue
          ISSUE_URL=$(gh issue create \
            --title "Closed Testing: v$VERSION Released" \
            --body "$ISSUE_BODY" \
            --label "v$VERSION" \
            --label "closed-testing" \
            --label "released" \
            --assignee ${{ github.actor }})
          
          echo "Created tracking issue: $ISSUE_URL"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update GitHub release
        run: |
          VERSION="${{ steps.get-version.outputs.version }}"
          
          # Update GitHub release with closed testing info
          gh release edit "v$VERSION" \
            --title "Release v$VERSION (Closed Testing)" \
            --body "$(gh release view v$VERSION --json body --jq .body)

          ## Closed Testing Release
          
          **Track:** Closed Testing (Alpha)
          **Rollout:** 100%
          **Released by:** ${{ github.actor }}
          **Released at:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          
          This version is now available in closed testing for internal validation." \
            --latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          VERSION="${{ steps.get-version.outputs.version }}"
          echo "## Release Complete! :white_check_mark:"
          echo ""
          echo "**Version:** v$VERSION"
          echo "**Track:** Closed Testing (Alpha)"
          echo "**Rollout:** 100%"
          echo "**Status:** Released to Google Play Console"
          echo ""
          echo "### Next Steps"
          echo "1. Test in closed testing for 24-48 hours"
          echo "2. Monitor crash rates and performance"
          echo "3. Use 'Promote Release with Approval' workflow for Beta/Production"
          echo ""
          echo "### Promotion Commands"
          echo "- **Beta:** \`gh workflow run 'Promote Release with Approval' --field track=beta --field version=$VERSION\`"
          echo "- **Production:** \`gh workflow run 'Promote Release with Approval' --field track=production --field version=$VERSION\`"
