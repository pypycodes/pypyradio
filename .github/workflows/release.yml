name: Build and Release Android App

on:
  push:
    tags:
      - 'v*'

jobs:
  check-version-change:
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.check.outputs.version_changed }}
      version_name: ${{ steps.check.outputs.version_name }}
      version_code: ${{ steps.check.outputs.version_code }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if version changed
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get current version info
          CURRENT_VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K\d+' AACMixRadioPlayer/app/build.gradle.kts)
          CURRENT_VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' AACMixRadioPlayer/app/build.gradle.kts)
          
          # Get latest published release from GitHub
          LATEST_RELEASE_TAG=$(gh release view --json tagName --jq .tagName 2>/dev/null || echo "v0.0.0")
          # Strip 'v' prefix
          LATEST_RELEASE_VERSION=${LATEST_RELEASE_TAG#v}
          
          echo "Current: versionCode=$CURRENT_VERSION_CODE, versionName=$CURRENT_VERSION_NAME"
          echo "Latest Published: tag=$LATEST_RELEASE_TAG, version=$LATEST_RELEASE_VERSION"
          
          if [ "$CURRENT_VERSION_NAME" != "$LATEST_RELEASE_VERSION" ]; then
            echo "version_changed=true" >> $GITHUB_OUTPUT
            echo "Version differs from latest release. Scheduling build."
          else
            echo "version_changed=false" >> $GITHUB_OUTPUT
            echo "Version matches latest release. Skipping build."
          fi
          
          echo "version_name=$CURRENT_VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$CURRENT_VERSION_CODE" >> $GITHUB_OUTPUT

  build-release:
    needs: check-version-change
    if: needs.check-version-change.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > AACMixRadioPlayer/keystores/release.keystore

      - name: Create keystore.properties
        run: |
          cat > AACMixRadioPlayer/keystore.properties << EOF
          storeFile=keystores/release.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build Release AAB
        working-directory: AACMixRadioPlayer
        run: ./gradlew bundleRelease

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: AACMixRadioPlayer/app/build/outputs/bundle/release/*.aab

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version-change.outputs.version_name }}
          name: Release v${{ needs.check-version-change.outputs.version_name }}
          body: |
            ## Release v${{ needs.check-version-change.outputs.version_name }}
            
            **Version Code:** ${{ needs.check-version-change.outputs.version_code }}
            
            ### Downloads
            - **AAB** - For Google Play Store upload
          files: |
            AACMixRadioPlayer/app/build/outputs/bundle/release/*.aab
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-to-play-store:
    needs: [check-version-change, build-release]
    runs-on: ubuntu-latest
    steps:
      - name: Download AAB Artifact
        uses: actions/download-artifact@v4
        with:
          name: release-aab
          path: ./release

      - name: Create Release Notes
        run: |
          mkdir -p whatsnew
          echo "Bug Fixes and Improvements" > whatsnew/whatsnew-en-US

      - name: Upload to Google Play Internal Testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.pypyradio.aacplayer
          releaseFiles: ./release/*.aab
          track: internal
          status: completed
          releaseName: ${{ needs.check-version-change.outputs.version_name }}
          whatsNewDirectory: whatsnew
