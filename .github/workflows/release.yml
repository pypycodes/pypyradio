name: Build and Release Android App

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'AACMixRadioPlayer/app/build.gradle.kts'

jobs:
  check-version-change:
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.check.outputs.version_changed }}
      version_name: ${{ steps.check.outputs.version_name }}
      version_code: ${{ steps.check.outputs.version_code }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if version changed
        id: check
        run: |
          # Get current version info
          CURRENT_VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K\d+' AACMixRadioPlayer/app/build.gradle.kts)
          CURRENT_VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' AACMixRadioPlayer/app/build.gradle.kts)
          
          # Get previous version info
          git show HEAD~1:AACMixRadioPlayer/app/build.gradle.kts > /tmp/prev_build.gradle.kts 2>/dev/null || echo "First commit"
          PREV_VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K\d+' /tmp/prev_build.gradle.kts 2>/dev/null || echo "0")
          PREV_VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' /tmp/prev_build.gradle.kts 2>/dev/null || echo "0.0.0")
          
          echo "Current: versionCode=$CURRENT_VERSION_CODE, versionName=$CURRENT_VERSION_NAME"
          echo "Previous: versionCode=$PREV_VERSION_CODE, versionName=$PREV_VERSION_NAME"
          
          if [ "$CURRENT_VERSION_CODE" != "$PREV_VERSION_CODE" ] || [ "$CURRENT_VERSION_NAME" != "$PREV_VERSION_NAME" ]; then
            echo "version_changed=true" >> $GITHUB_OUTPUT
          else
            echo "version_changed=false" >> $GITHUB_OUTPUT
          fi
          
          echo "version_name=$CURRENT_VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$CURRENT_VERSION_CODE" >> $GITHUB_OUTPUT

  build-release:
    needs: check-version-change
    if: needs.check-version-change.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > AACMixRadioPlayer/keystores/release.keystore

      - name: Create keystore.properties
        run: |
          cat > AACMixRadioPlayer/keystore.properties << EOF
          storeFile=keystores/release.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build Release APK
        working-directory: AACMixRadioPlayer
        run: ./gradlew assembleRelease

      - name: Build Release AAB
        working-directory: AACMixRadioPlayer
        run: ./gradlew bundleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: AACMixRadioPlayer/app/build/outputs/apk/release/*.apk

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: AACMixRadioPlayer/app/build/outputs/bundle/release/*.aab

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version-change.outputs.version_name }}
          name: Release v${{ needs.check-version-change.outputs.version_name }}
          body: |
            ## Release v${{ needs.check-version-change.outputs.version_name }}
            
            **Version Code:** ${{ needs.check-version-change.outputs.version_code }}
            
            ### Downloads
            - **APK** - Direct install on Android devices
            - **AAB** - For Google Play Store upload
          files: |
            AACMixRadioPlayer/app/build/outputs/apk/release/*.apk
            AACMixRadioPlayer/app/build/outputs/bundle/release/*.aab
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
