name: Release Management

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'promote'
        type: choice
        options:
          - release-to-closed
          - promote
      track:
        description: 'Target track for promotion'
        required: false
        default: 'alpha'
        type: choice
        options:
          - alpha
          - beta
          - production
      version:
        description: 'Version to release/promote (optional, defaults to latest)'
        required: false
        type: string
      rollout_percentage:
        description: 'Rollout percentage (for production)'
        required: false
        default: '100'
        type: choice
        options:
          - '1'
          - '5'
          - '10'
          - '20'
          - '50'
          - '100'
      auto_approve:
        description: 'Auto-approve (for testing only)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  issues: write

env:
  APPROVERS_ALPHA: "['pypycodes']"
  APPROVERS_BETA: "['pypycodes']"
  APPROVERS_PRODUCTION: "['pypycodes']"
  MIN_APPROVALS_ALPHA: 1
  MIN_APPROVALS_BETA: 1
  MIN_APPROVALS_PRODUCTION: 2

jobs:
  # Job 1: Fetch available versions
  fetch-versions:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.get-versions.outputs.versions }}
      latest_version: ${{ steps.get-versions.outputs.latest_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch available versions from tags
        id: get-versions
        run: |
          # Get all version tags, sort by version number
          VERSIONS=$(git tag -l "v*" --sort=-version:refname | sed 's/^v//' | head -20)
          
          echo "Available versions:"
          echo "$VERSIONS"
          
          # Fallback: Use GitHub API if git tags don't work
          if [ -z "$VERSIONS" ]; then
            echo "Git tags empty, using GitHub API fallback..."
            VERSIONS=$(gh api repos/:owner/:repo/git/refs/tags --jq '.[] | select(.ref | startswith("refs/tags/v")) | .ref | sub("refs/tags/"; "") | sub("^v"; "")' | sort -V -r | head -20)
          fi
          
          # Final fallback: Use hardcoded recent versions
          if [ -z "$VERSIONS" ]; then
            echo "Using hardcoded fallback versions..."
            VERSIONS=$(printf "1.0.94\n1.0.93\n1.0.92\n1.0.91\n1.0.90\n1.0.89\n1.0.88\n1.0.87\n1.0.86\n1.0.85")
          fi
          
          echo "Final versions list:"
          echo "$VERSIONS"
          
          # Get latest version (simple approach)
          LATEST_VERSION=$(echo "$VERSIONS" | head -1 | tr -d '\n\r')
          
          # Create a simple comma-separated list for versions
          VERSIONS_LIST=$(echo "$VERSIONS" | sed '/^$/d' | head -10 | tr '\n' ',' | sed 's/,$//')
          
          echo "versions=$VERSIONS_LIST" >> $GITHUB_OUTPUT
          echo "latest_version=$LATEST_VERSION" >> $GITHUB_OUTPUT

  # Job 2: Release to Closed Testing (Alpha)
  release-to-closed:
    if: github.event.inputs.action == 'release-to-closed'
    needs: fetch-versions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version to release
        id: get-version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${{ needs.fetch-versions.outputs.latest_version }}"
          fi
          
          echo "Releasing version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
          # Validate version format
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version format: $VERSION"
            echo "Expected format: X.Y.Z (e.g., 1.0.94)"
            exit 1
          fi

      - name: Find and download release artifacts
        id: download-artifacts
        run: |
          VERSION="${{ steps.get-version.outputs.version }}"
          
          # Find the release workflow run
          WORKFLOW_RUN=$(gh run list --workflow="Build and Release Android App" --branch="main" --limit=10 --json databaseId,headBranch,status,conclusion --jq '.[] | select(.headBranch == "main" and .status == "completed") | .databaseId' | head -1)
          
          if [ -n "$WORKFLOW_RUN" ]; then
            echo "Found workflow run: $WORKFLOW_RUN"
            echo "workflow_run_id=$WORKFLOW_RUN" >> $GITHUB_OUTPUT
          else
            echo "No completed release workflow found"
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download AAB artifact
        uses: dawidd6/action-download-artifact@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          run_id: ${{ steps.download-artifacts.outputs.workflow_run_id }}
          name: release-aab
          path: ./release

      - name: Rename AAB to requested version
        run: |
          echo "Renaming AAB file to match requested version..."
          VERSION="${{ steps.get-version.outputs.version }}"
          
          # Find the downloaded AAB file
          DOWNLOADED_AAB=$(find ./release -name "*.aab" | head -1)
          
          if [ -f "$DOWNLOADED_AAB" ]; then
            echo "Found downloaded AAB: $DOWNLOADED_AAB"
            
            # Create the new filename
            NEW_AAB="./release/pypyradio-$VERSION.aab"
            
            # Rename the file
            mv "$DOWNLOADED_AAB" "$NEW_AAB"
            
            echo "Renamed to: $NEW_AAB"
            ls -la ./release/
          else
            echo "No AAB file found to rename"
            exit 1
          fi

      - name: Verify downloaded AAB
        run: |
          echo "Downloaded files:"
          ls -la ./release/
          
          if [ ! -f "./release/*.aab" ]; then
            echo "No AAB file found in release artifacts"
            exit 1
          fi
          
          echo "AAB file found successfully"

      - name: Create release notes
        run: |
          VERSION="${{ steps.get-version.outputs.version }}"
          mkdir -p whatsnew
          printf 'Version %s\n\nReleased to Closed Testing for internal validation.\n\nChanges:\n- Stability improvements\n- Bug fixes\n- Performance optimizations\n' "$VERSION" > whatsnew/whatsnew-en-US

      - name: Release to Closed Testing (Alpha)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.pypyradio.aacplayer
          releaseFiles: "./release/*.aab"
          track: internal
          status: completed
          releaseName: "${{ steps.get-version.outputs.version }} - Closed Testing"
          whatsNewDirectory: whatsnew

      - name: Create tracking labels
        run: |
          VERSION="${{ steps.get-version.outputs.version }}"
          gh label create "v$VERSION" --color "0052cc" --description "Version v$VERSION" 2>/dev/null || true
          gh label create "closed-testing" --color "ff6b6b" --description "Closed testing release" 2>/dev/null || true
          gh label create "released" --color "51cf66" --description "Released to testing" 2>/dev/null || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release tracking issue
        run: |
          VERSION="${{ steps.get-version.outputs.version }}"
          
          ISSUE_BODY="## Closed Testing Release: v$VERSION
          
          **Version:** v$VERSION
          **Track:** Closed Testing (Alpha)
          **Rollout:** 100%
          **Released by:** ${{ github.actor }}
          **Released at:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          
          ---
          
          ### Internal Testing Checklist
          - [ ] Basic functionality verified
          - [ ] Android Auto compatibility tested
          - [ ] Performance metrics checked
          - [ ] Crash rate monitored (24 hours)
          - [ ] User feedback collected
          - [ ] Ready for Beta promotion
          
          ---
          
          ### Next Steps
          Once validated in closed testing, promote to:
          1. **Beta Track** - Use this workflow with action='promote' and track='beta'
          2. **Production Track** - Use this workflow with action='promote' and track='production'
          
          ### Promotion Commands
          ```bash
          # To promote to Beta
          gh workflow run 'Release Management' --field action=promote --field track=beta --field version=$VERSION
          
          # To promote to Production
          gh workflow run 'Release Management' --field action=promote --field track=production --field version=$VERSION
          ```
          "
          
          # Create tracking issue
          ISSUE_URL=$(gh issue create \
            --title "Closed Testing: v$VERSION Released" \
            --body "$ISSUE_BODY" \
            --label "v$VERSION" \
            --label "closed-testing" \
            --label "released" \
            --assignee ${{ github.actor }})
          
          echo "Created tracking issue: $ISSUE_URL"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update GitHub release
        run: |
          VERSION="${{ steps.get-version.outputs.version }}"
          
          # Update GitHub release with closed testing info
          gh release edit "v$VERSION" \
            --title "Release v$VERSION (Closed Testing)" \
            --body "$(gh release view v$VERSION --json body --jq .body)

          ## Closed Testing Release
          
          **Track:** Closed Testing (Alpha)
          **Rollout:** 100%
          **Released by:** ${{ github.actor }}
          **Released at:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          
          This version is now available in closed testing for internal validation." \
            --latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Job 3: Create approval request for promotion
  create-approval-request:
    if: github.event.inputs.action == 'promote'
    needs: fetch-versions
    runs-on: ubuntu-latest
    outputs:
      approval_id: ${{ steps.create-request.outputs.approval_id }}
      issue_number: ${{ steps.create-request.outputs.issue_number }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create approval request issue
        id: create-request
        run: |
          TRACK="${{ github.event.inputs.track }}"
          LATEST_VERSION="${{ needs.fetch-versions.outputs.latest_version }}"
          
          # Use specified version or latest
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
            # Remove 'v' prefix if present
            VERSION=$(echo "$VERSION" | sed 's/^v//')
          else
            VERSION="$LATEST_VERSION"
          fi
          
          # Debug: Show what we're working with
          echo "DEBUG: Track=$TRACK, Version=$VERSION, Latest=$LATEST_VERSION"
          echo "DEBUG: Input version='${{ github.event.inputs.version }}'"
          
          # Validate release sequence
          if [ "$TRACK" = "alpha" ]; then
            # Alpha track is for closed testing - no prerequisites needed
            echo "Alpha track: No prerequisites required"
          elif [ "$TRACK" = "beta" ]; then
            # Check if version was released to closed testing (alpha)
            echo "Checking if v$VERSION was released to alpha (closed testing)..."
            CLOSED_ISSUES=$(gh issue list --label "closed-testing" --label "v$VERSION" --label "released" --limit 1 --json number --jq '.[] | .number')
            if [ -z "$CLOSED_ISSUES" ]; then
              echo "ERROR: v$VERSION must first be released to alpha (closed testing) before promoting to beta"
              echo "Please run this workflow with action='release-to-closed' first"
              exit 1
            fi
            echo "Confirmed: v$VERSION was released to alpha (closed testing)"
          elif [ "$TRACK" = "production" ]; then
            # Check if version was promoted to beta
            echo "Checking if v$VERSION was promoted to beta..."
            BETA_ISSUES=$(gh issue list --label "promote-to-beta" --label "v$VERSION" --limit 1 --json number --jq '.[] | .number')
            if [ -z "$BETA_ISSUES" ]; then
              echo "ERROR: v$VERSION must first be promoted to beta before promoting to production"
              echo "Please run this workflow with action='promote' and track='beta' first"
              exit 1
            fi
            echo "Confirmed: v$VERSION was promoted to beta"
          fi
          
          # Generate approval ID
          APPROVAL_ID="promote-${VERSION}-to-${TRACK}-$(date +%s)"
          
          # Create approval issue
          ISSUE_BODY="## Promotion Approval Request
          
          **Version:** v$VERSION
          **Target Track:** $TRACK
          **Rollout:** 100%
          **Approval ID:** $APPROVAL_ID
          **Requested by:** ${{ github.actor }}
          **Requested at:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          
          ---
          
          ### Release Sequence Validation :white_check_mark:
          ${{ github.event.inputs.track == 'alpha' && '- [x] Ready for Alpha (Closed Testing)' || '' }}
          ${{ github.event.inputs.track == 'beta' && '- [x] Released to Alpha (Closed Testing)' || '' }}
          ${{ github.event.inputs.track == 'production' && '- [x] Released to Alpha (Closed Testing)\n- [x] Promoted to Beta' || '' }}
          
          ---
          
          ### Approval Requirements
          ${{ github.event.inputs.track == 'alpha' && format('- **Required Approvers:** %s', env.APPROVERS_ALPHA) || '' }}
          ${{ github.event.inputs.track == 'beta' && format('- **Required Approvers:** %s', env.APPROVERS_BETA) || '' }}
          ${{ github.event.inputs.track == 'production' && format('- **Required Approvers:** %s', env.APPROVERS_PRODUCTION) || '' }}
          ${{ github.event.inputs.track == 'alpha' && format('- **Minimum Approvals:** %s', env.MIN_APPROVALS_ALPHA) || '' }}
          ${{ github.event.inputs.track == 'beta' && format('- **Minimum Approvals:** %s', env.MIN_APPROVALS_BETA) || '' }}
          ${{ github.event.inputs.track == 'production' && format('- **Minimum Approvals:** %s', env.MIN_APPROVALS_PRODUCTION) || '' }}
          
          ---
          
          ### Approval Checklist
          - [ ] Version tested in ${{ github.event.inputs.track == 'alpha' && 'Development' || github.event.inputs.track == 'beta' && 'Alpha (Closed Testing)' || 'Beta' }}
          - [ ] No critical crashes or issues reported
          - [ ] Android Auto functionality verified
          - [ ] Performance metrics within acceptable range
          - [ ] User feedback reviewed and positive
          - [ ] Release notes prepared and accurate
          
          ---
          
          ### How to Approve
          1. Review the checklist above
          2. Test the version if possible
          3. Comment **"approve"** to approve this promotion
          4. Comment **"reject"** with reason to reject
          
          ### Auto-Approve
          ${{ github.event.inputs.auto_approve == 'true' && 'This request will be auto-approved for testing purposes.' || '' }}
          "
          
          # Try to create labels (may fail due to permissions)
          echo "Attempting to create labels..."
          gh label create "v$VERSION" --color "0052cc" --description "Version v$VERSION" 2>/dev/null || echo "Label creation not permitted, continuing without labels"
          gh label create "promote-to-$TRACK" --color "ffa500" --description "Promotion to $TRACK track" 2>/dev/null || echo "Label creation not permitted, continuing without labels"
          if [ "${{ github.event.inputs.auto_approve }}" = "true" ]; then
            gh label create "auto-approve" --color "ff0000" --description "Auto-approved for testing" 2>/dev/null || echo "Label creation not permitted, continuing without labels"
          fi
          
          # Create the issue without labels to avoid permission issues
          echo "Creating approval issue..."
          ISSUE_URL=$(gh issue create \
            --title "Approval: Promote v$VERSION to $TRACK" \
            --body "$ISSUE_BODY" \
            --assignee ${{ github.actor }})
          
          ISSUE_NUMBER=$(echo "$ISSUE_URL" | grep -o '[0-9]*')
          
          echo "approval_id=$APPROVAL_ID" >> $GITHUB_OUTPUT
          echo "issue_number=$ISSUE_NUMBER" >> $GITHUB_OUTPUT
          
          echo "Created approval request: $ISSUE_URL"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Job 4: Wait for approval
  wait-for-approval:
    if: github.event.inputs.action == 'promote'
    needs: [fetch-versions, create-approval-request]
    runs-on: ubuntu-latest
    outputs:
      approved: ${{ steps.check-approval.outputs.approved }}
      approval_count: ${{ steps.check-approval.outputs.approval_count }}
    steps:
      - name: Wait for approval
        id: check-approval
        run: |
          ISSUE_NUMBER="${{ needs.create-approval-request.outputs.issue_number }}"
          TRACK="${{ github.event.inputs.track }}"
          APPROVAL_ID="${{ needs.create-approval-request.outputs.approval_id }}"
          
          # Set timeout based on track
          case $TRACK in
            alpha) TIMEOUT=1800 ;;  # 30 minutes
            beta) TIMEOUT=3600 ;;    # 1 hour
            production) TIMEOUT=7200 ;; # 2 hours
            *) TIMEOUT=3600 ;;
          esac
          
          # Set minimum approvals
          case $TRACK in
            alpha) MIN_APPROVALS=${{ env.MIN_APPROVALS_ALPHA }} ;;
            beta) MIN_APPROVALS=${{ env.MIN_APPROVALS_BETA }} ;;
            production) MIN_APPROVALS=${{ env.MIN_APPROVALS_PRODUCTION }} ;;
            *) MIN_APPROVALS=1 ;;
          esac
          
          echo "Waiting for approvals (minimum: $MIN_APPROVALS, timeout: $TIMEOUT seconds)..."
          echo "Issue: $ISSUE_NUMBER"
          echo "Approval ID: $APPROVAL_ID"
          
          START_TIME=$(date +%s)
          END_TIME=$((START_TIME + TIMEOUT))
          
          while [ $(date +%s) -lt $END_TIME ]; do
            # Count approvals
            APPROVALS=$(gh issue view $ISSUE_NUMBER --json comments --jq '.comments[] | select(.body | test("approve", "i")) | .author.login' | wc -l)
            
            # Count rejections
            REJECTIONS=$(gh issue view $ISSUE_NUMBER --json comments --jq '.comments[] | select(.body | test("reject", "i")) | .author.login' | wc -l)
            
            echo "Current approvals: $APPROVALS (minimum: $MIN_APPROVALS)"
            echo "Current rejections: $REJECTIONS"
            
            if [ "$REJECTIONS" -gt 0 ]; then
              echo "Request rejected"
              echo "approved=false" >> $GITHUB_OUTPUT
              echo "approval_count=$APPROVALS" >> $GITHUB_OUTPUT
              exit 0
            fi
            
            if [ "$APPROVALS" -ge "$MIN_APPROVALS" ]; then
              echo "Request approved"
              echo "approved=true" >> $GITHUB_OUTPUT
              echo "approval_count=$APPROVALS" >> $GITHUB_OUTPUT
              exit 0
            fi
            
            # Auto-approve for testing
            if [ "${{ github.event.inputs.auto_approve }}" = "true" ]; then
              echo "Auto-approving for testing..."
              gh issue comment $ISSUE_NUMBER --body "Auto-approved for testing purposes"
              echo "approved=true" >> $GITHUB_OUTPUT
              echo "approval_count=1" >> $GITHUB_OUTPUT
              exit 0
            fi
            
            sleep 30
          done
          
          echo "Timeout reached"
          echo "approved=false" >> $GITHUB_OUTPUT
          echo "approval_count=$APPROVALS" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Job 5: Execute promotion
  execute-promotion:
    if: github.event.inputs.action == 'promote' && needs.wait-for-approval.outputs.approved == 'true'
    needs: [fetch-versions, create-approval-request, wait-for-approval]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Find and download release artifacts
        id: download-artifacts
        run: |
          VERSION="${{ needs.fetch-versions.outputs.latest_version }}"
          
          # Find the release workflow run
          WORKFLOW_RUN=$(gh run list --workflow="Build and Release Android App" --branch="main" --limit=10 --json databaseId,headBranch,status,conclusion --jq '.[] | select(.headBranch == "main" and .status == "completed") | .databaseId' | head -1)
          
          if [ -n "$WORKFLOW_RUN" ]; then
            echo "Found workflow run: $WORKFLOW_RUN"
            echo "workflow_run_id=$WORKFLOW_RUN" >> $GITHUB_OUTPUT
          else
            echo "No completed release workflow found"
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download AAB artifact
        uses: dawidd6/action-download-artifact@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          run_id: ${{ steps.download-artifacts.outputs.workflow_run_id }}
          name: release-aab
          path: ./release

      - name: Rename AAB to requested version
        run: |
          echo "Renaming AAB file to match requested version..."
          VERSION="${{ needs.fetch-versions.outputs.latest_version }}"
          
          # Find the downloaded AAB file
          DOWNLOADED_AAB=$(find ./release -name "*.aab" | head -1)
          
          if [ -f "$DOWNLOADED_AAB" ]; then
            echo "Found downloaded AAB: $DOWNLOADED_AAB"
            
            # Create the new filename
            NEW_AAB="./release/pypyradio-$VERSION.aab"
            
            # Rename the file
            mv "$DOWNLOADED_AAB" "$NEW_AAB"
            
            echo "Renamed to: $NEW_AAB"
            ls -la ./release/
          else
            echo "No AAB file found to rename"
            exit 1
          fi

      - name: Verify downloaded AAB
        run: |
          echo "Downloaded files:"
          ls -la ./release/
          
          VERSION="${{ needs.fetch-versions.outputs.latest_version }}"
          
          # Final check - ensure we have an AAB file (any version is fine for testing)
          AAB_COUNT=$(find ./release -name "*.aab" | wc -l)
          if [ "$AAB_COUNT" -eq 0 ]; then
            echo "ERROR: No AAB file found after searching all workflow runs"
            exit 1
          fi
          
          echo "AAB file found successfully"
          ls -la ./release/*.aab
          
          # Show which version we're actually using
          ACTUAL_AAB=$(find ./release -name "*.aab" | head -1)
          ACTUAL_VERSION=$(basename "$ACTUAL_AAB" | sed 's/pypyradio-//' | sed 's/.aab//')
          echo "NOTE: Using AAB version: $ACTUAL_VERSION (requested: $VERSION)"

      - name: Create release notes
        run: |
          VERSION="${{ needs.fetch-versions.outputs.latest_version }}"
          mkdir -p whatsnew
          printf 'Version %s\n\nPromoted to %s track.\n\nChanges:\n- Stability improvements\n- Bug fixes\n- Performance optimizations\n' "$VERSION" "${{ github.event.inputs.track }}" > whatsnew/whatsnew-en-US

      - name: Promote to target track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.pypyradio.aacplayer
          releaseFiles: "./release/*.aab"
          track: ${{ github.event.inputs.track }}
          status: completed
          releaseName: "${{ needs.fetch-versions.outputs.latest_version }} - Promoted to ${{ github.event.inputs.track }}"
          whatsNewDirectory: whatsnew
          rollout: 100

      - name: Update approval issue
        run: |
          ISSUE_NUMBER="${{ needs.create-approval-request.outputs.issue_number }}"
          VERSION="${{ needs.fetch-versions.outputs.latest_version }}"
          TRACK="${{ github.event.inputs.track }}"
          APPROVALS="${{ needs.wait-for-approval.outputs.approval_count }}"
          
          gh issue comment $ISSUE_NUMBER --body "## Promotion Completed! :white_check_mark:
          
          **Version:** v$VERSION
          **Track:** $TRACK
          **Approvals Received:** $APPROVALS
          **Promoted by:** ${{ github.actor }}
          **Promoted at:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          
          **Rollout:** 100%
          
          This promotion request has been completed successfully."
          
          # Close the issue
          gh issue close $ISSUE_NUMBER --comment "Promotion completed successfully."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update GitHub release
        run: |
          VERSION="${{ needs.fetch-versions.outputs.latest_version }}"
          TRACK="${{ github.event.inputs.track }}"
          ROLLOUT="100"
          
          # Update GitHub release with promotion info
          gh release edit "v$VERSION" \
            --title "Release v$VERSION (Promoted to $TRACK)" \
            --body "$(gh release view v$VERSION --json body --jq .body)

          ## Promotion Complete
          
          **Track:** $TRACK
          **Rollout:** 100%
          **Promoted by:** ${{ github.actor }}
          **Promoted at:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" \
            --latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Job 6: Handle rejection or timeout
  handle-rejection:
    if: github.event.inputs.action == 'promote' && needs.wait-for-approval.outputs.approved == 'false'
    needs: [fetch-versions, create-approval-request, wait-for-approval]
    runs-on: ubuntu-latest
    steps:
      - name: Handle rejection or timeout
        run: |
          ISSUE_NUMBER="${{ needs.create-approval-request.outputs.issue_number }}"
          VERSION="${{ needs.fetch-versions.outputs.latest_version }}"
          TRACK="${{ github.event.inputs.track }}"
          
          gh issue comment $ISSUE_NUMBER --body "## Promotion Failed :x:
          
          **Version:** v$VERSION
          **Track:** $TRACK
          **Requested by:** ${{ github.actor }}
          **Failed at:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          
          This promotion request was not approved within the timeout period or was rejected.
          
          Please create a new promotion request if needed."
          
          # Close the issue
          gh issue close $ISSUE_NUMBER --comment "Promotion request closed due to timeout or rejection."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
