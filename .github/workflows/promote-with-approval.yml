name: Promote Release with Approval

on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Target track for promotion'
        required: true
        default: 'alpha'
        type: choice
        options:
          - alpha
          - beta
          - production
      version:
        description: 'Version to promote (optional, defaults to latest)'
        required: false
        type: string
      auto_approve:
        description: 'Auto-approve (for testing only)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  issues: write

env:
  APPROVERS_BETA: "['pypycodes']"
  APPROVERS_PRODUCTION: "['pypycodes']"
  APPROVERS_CLOSED: "['pypycodes']"
  MIN_APPROVALS_BETA: 1
  MIN_APPROVALS_PRODUCTION: 2
  MIN_APPROVALS_CLOSED: 3

jobs:
  # Job 1: Fetch available versions and create environment file
  fetch-versions:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.get-versions.outputs.versions }}
      latest_version: ${{ steps.get-versions.outputs.latest_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch available versions from tags
        id: get-versions
        run: |
          # Get all version tags, sort by version number
          VERSIONS=$(git tag -l "v*" --sort=-version:refname | sed 's/^v//' | head -20)
          
          echo "Available versions:"
          echo "$VERSIONS"
          
          # Fallback: Use GitHub API if git tags don't work
          if [ -z "$VERSIONS" ]; then
            echo "Git tags empty, using GitHub API fallback..."
            VERSIONS=$(gh api repos/:owner/:repo/git/refs/tags --jq '.[] | select(.ref | startswith("refs/tags/v")) | .ref | sub("refs/tags/"; "") | sub("^v"; "")' | sort -V -r | head -20)
          fi
          
          # Final fallback: Use hardcoded recent versions
          if [ -z "$VERSIONS" ]; then
            echo "Using hardcoded fallback versions..."
            VERSIONS=$(printf "1.0.94\n1.0.93\n1.0.92\n1.0.91\n1.0.90\n1.0.89\n1.0.88\n1.0.87\n1.0.86\n1.0.85")
          fi
          
          echo "Final versions list:"
          echo "$VERSIONS"
          
          # Get latest version (simple approach)
          LATEST_VERSION=$(echo "$VERSIONS" | head -1 | tr -d '\n\r')
          
          # Create a simple comma-separated list for versions
          VERSIONS_LIST=$(echo "$VERSIONS" | sed '/^$/d' | head -10 | tr '\n' ',' | sed 's/,$//')
          
          echo "versions=$VERSIONS_LIST" >> $GITHUB_OUTPUT
          echo "latest_version=$LATEST_VERSION" >> $GITHUB_OUTPUT

  # Job 2: Create approval request
  create-approval-request:
    needs: fetch-versions
    runs-on: ubuntu-latest
    outputs:
      approval_id: ${{ steps.create-request.outputs.approval_id }}
      issue_number: ${{ steps.create-request.outputs.issue_number }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create approval request issue
        id: create-request
        run: |
          TRACK="${{ github.event.inputs.track }}"
          LATEST_VERSION="${{ needs.fetch-versions.outputs.latest_version }}"
          
          # Use specified version or latest
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
            # Remove 'v' prefix if present
            VERSION=$(echo "$VERSION" | sed 's/^v//')
            echo "Using specified version: $VERSION"
          else
            VERSION="$LATEST_VERSION"
            echo "Using latest version: $VERSION"
          fi
          
          # Debug: Show what we're working with
          echo "DEBUG: Track=$TRACK, Version=$VERSION, Latest=$LATEST_VERSION"
          echo "DEBUG: Input version='${{ github.event.inputs.version }}'"
          
          # Validate release sequence
          if [ "$TRACK" = "alpha" ]; then
            # Alpha track is for closed testing - no prerequisites needed
            echo "Alpha track: No prerequisites required"
          elif [ "$TRACK" = "beta" ]; then
            # Check if version was released to closed testing (alpha)
            echo "Checking if v$VERSION was released to alpha (closed testing)..."
            CLOSED_ISSUES=$(gh issue list --label "closed-testing" --label "v$VERSION" --label "released" --limit 1 --json number --jq '.[] | .number')
            if [ -z "$CLOSED_ISSUES" ]; then
              echo "ERROR: v$VERSION must first be released to alpha (closed testing) before promoting to beta"
              echo "Please run 'Release to Closed Testing (Alpha)' workflow first"
              exit 1
            fi
            echo "Confirmed: v$VERSION was released to alpha (closed testing)"
          elif [ "$TRACK" = "production" ]; then
            # Check if version was promoted to beta
            echo "Checking if v$VERSION was promoted to beta..."
            BETA_ISSUES=$(gh issue list --label "promote-to-beta" --label "v$VERSION" --limit 1 --json number --jq '.[] | .number')
            if [ -z "$BETA_ISSUES" ]; then
              echo "ERROR: v$VERSION must first be promoted to beta before promoting to production"
              echo "Please run 'Promote Release with Approval' workflow for beta first"
              exit 1
            fi
            echo "Confirmed: v$VERSION was promoted to beta"
          fi
          
          # Generate approval ID
          APPROVAL_ID="promote-${VERSION}-to-${TRACK}-$(date +%s)"
          
          # Create approval issue
          ISSUE_BODY="## Promotion Approval Request
          
          **Version:** v$VERSION
          **Target Track:** $TRACK
          **Rollout:** 100%
          **Approval ID:** $APPROVAL_ID
          **Requested by:** ${{ github.actor }}
          **Requested at:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          
          ---
          
          ### Release Sequence Validation :white_check_mark:
          ${{ github.event.inputs.track == 'alpha' && '- [x] Ready for Alpha (Closed Testing)' || '' }}
          ${{ github.event.inputs.track == 'beta' && '- [x] Released to Alpha (Closed Testing)' || '' }}
          ${{ github.event.inputs.track == 'production' && '- [x] Released to Alpha (Closed Testing)\n- [x] Promoted to Beta' || '' }}
          
          ---
          
          ### Approval Requirements
          ${{ github.event.inputs.track == 'alpha' && format('- **Required Approvers:** %s', env.APPROVERS_BETA) || '' }}
          ${{ github.event.inputs.track == 'beta' && format('- **Required Approvers:** %s', env.APPROVERS_BETA) || '' }}
          ${{ github.event.inputs.track == 'production' && format('- **Required Approvers:** %s', env.APPROVERS_PRODUCTION) || '' }}
          ${{ github.event.inputs.track == 'alpha' && format('- **Minimum Approvals:** %s', env.MIN_APPROVALS_BETA) || '' }}
          ${{ github.event.inputs.track == 'beta' && format('- **Minimum Approvals:** %s', env.MIN_APPROVALS_BETA) || '' }}
          ${{ github.event.inputs.track == 'production' && format('- **Minimum Approvals:** %s', env.MIN_APPROVALS_PRODUCTION) || '' }}
          
          ---
          
          ### Approval Checklist
          - [ ] Version tested in ${{ github.event.inputs.track == 'alpha' && 'Development' || github.event.inputs.track == 'beta' && 'Alpha (Closed Testing)' || 'Beta' }}
          - [ ] No critical crashes or issues reported
          - [ ] Android Auto functionality verified
          - [ ] Performance metrics within acceptable range
          - [ ] User feedback reviewed and positive
          - [ ] Release notes prepared and accurate
          
          ---
          
          ### How to Approve
          1. Review the checklist above
          2. Test the version if possible
          3. Comment **"approve"** to approve this promotion
          4. Comment **"reject"** with reason to reject
          
          ### Auto-Approve
          ${{ github.event.inputs.auto_approve == 'true' && 'This request will be auto-approved for testing purposes.' || '' }}
          "
          
          # Try to create labels (may fail due to permissions)
          echo "Attempting to create labels..."
          gh label create "v$VERSION" --color "0052cc" --description "Version v$VERSION" 2>/dev/null || echo "Label creation not permitted, continuing without labels"
          gh label create "promote-to-$TRACK" --color "ffa500" --description "Promotion to $TRACK track" 2>/dev/null || echo "Label creation not permitted, continuing without labels"
          if [ "${{ github.event.inputs.auto_approve }}" = "true" ]; then
            gh label create "auto-approve" --color "ff0000" --description "Auto-approved for testing" 2>/dev/null || echo "Label creation not permitted, continuing without labels"
          fi
          
          # Create the issue without labels to avoid permission issues
          echo "Creating approval issue..."
          ISSUE_URL=$(gh issue create \
            --title "Approval: Promote v$VERSION to $TRACK" \
            --body "$ISSUE_BODY" \
            --assignee ${{ github.actor }})
          
          ### Approval Checklist
          - [ ] Version tested in ${{ github.event.inputs.track == 'alpha' && 'Development' || github.event.inputs.track == 'beta' && 'Alpha (Closed Testing)' || 'Beta' }}
          - [ ] No critical crashes or issues reported
          - [ ] Android Auto functionality verified
          - [ ] Performance metrics within acceptable range
          - [ ] User feedback reviewed and positive
          - [ ] Release notes prepared and accurate
          
          ---
          
          ### How to Approve
          1. Review the checklist above
          2. Test the version if possible
          3. Comment **"approve"** to approve this promotion
          4. Comment **"reject"** with reason to reject
          
          ### Auto-Approve
          ${{ github.event.inputs.auto_approve == 'true' && 'This request will be auto-approved for testing purposes.' || '' }}
          "
          
          # Create the issue
          ISSUE_URL=$(gh issue create \
            --title "Approval: Promote v$VERSION to $TRACK" \
            --body "$ISSUE_BODY" \
            --label "v$VERSION" \
            --label "promote-to-$TRACK" \
            --label "${{ github.event.inputs.auto_approve == 'true' && 'auto-approve' || '' }}" \
            --assignee ${{ github.actor }})
          
          ISSUE_NUMBER=$(echo "$ISSUE_URL" | grep -o '[0-9]*')
          
          echo "approval_id=$APPROVAL_ID" >> $GITHUB_OUTPUT
          echo "issue_number=$ISSUE_NUMBER" >> $GITHUB_OUTPUT
          
          echo "Created approval request: $ISSUE_URL"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Job 3: Wait for approval (with timeout)
  wait-for-approval:
    needs: [fetch-versions, create-approval-request]
    runs-on: ubuntu-latest
    outputs:
      approved: ${{ steps.check-approval.outputs.approved }}
      approval_count: ${{ steps.check-approval.outputs.approval_count }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Wait for approval
        id: check-approval
        run: |
          ISSUE_NUMBER="${{ needs.create-approval-request.outputs.issue_number }}"
          TRACK="${{ github.event.inputs.track }}"
          
          # Set timeout based on track
          case $TRACK in
            "beta") TIMEOUT=1800 ;;     # 30 minutes
            "production") TIMEOUT=3600 ;; # 1 hour
            "closed") TIMEOUT=7200 ;;    # 2 hours
            *) TIMEOUT=1800 ;;
          esac
          
          echo "Waiting for approval (timeout: $TIMEOUT seconds)..."
          
          START_TIME=$(date +%s)
          
          while true; do
            CURRENT_TIME=$(date +%s)
            ELAPSED=$((CURRENT_TIME - START_TIME))
            
            if [ $ELAPSED -gt $TIMEOUT ]; then
              echo "Approval timeout reached"
              echo "approved=false" >> $GITHUB_OUTPUT
              echo "approval_count=0" >> $GITHUB_OUTPUT
              exit 0
            fi
            
            # Check for auto-approve
            if [ "${{ github.event.inputs.auto_approve }}" = "true" ]; then
              echo "Auto-approving for testing..."
              echo "approved=true" >> $GITHUB_OUTPUT
              echo "approval_count=999" >> $GITHUB_OUTPUT
              exit 0
            fi
            
            # Count approvals
            APPROVALS=$(gh issue view $ISSUE_NUMBER --json comments --jq '.comments[] | select(.body | test("approve", "i")) | .author.login' | wc -l)
            
            # Get minimum approvals required
            case $TRACK in
              "beta") MIN_APPROVALS=${{ env.MIN_APPROVALS_BETA }} ;;
              "production") MIN_APPROVALS=${{ env.MIN_APPROVALS_PRODUCTION }} ;;
              "closed") MIN_APPROVALS=${{ env.MIN_APPROVALS_CLOSED }} ;;
              *) MIN_APPROVALS=1 ;;
            esac
            
            echo "Current approvals: $APPROVALS, Required: $MIN_APPROVALS"
            
            if [ "$APPROVALS" -ge "$MIN_APPROVALS" ]; then
              echo "Sufficient approvals received"
              echo "approved=true" >> $GITHUB_OUTPUT
              echo "approval_count=$APPROVALS" >> $GITHUB_OUTPUT
              exit 0
            fi
            
            # Check for rejections
            REJECTIONS=$(gh issue view $ISSUE_NUMBER --json comments --jq '.comments[] | select(.body | test("reject", "i")) | .author.login' | wc -l)
            if [ "$REJECTIONS" -gt 0 ]; then
              echo "Rejection detected"
              echo "approved=false" >> $GITHUB_OUTPUT
              echo "approval_count=0" >> $GITHUB_OUTPUT
              exit 0
            fi
            
            sleep 30
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Job 4: Execute promotion if approved
  execute-promotion:
    needs: [fetch-versions, create-approval-request, wait-for-approval]
    if: needs.wait-for-approval.outputs.approved == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Find and download release artifacts
        id: download-artifacts
        run: |
          VERSION="${{ needs.fetch-versions.outputs.latest_version }}"
          
          # Find the release workflow run that matches the version
          echo "Searching for workflow run for v$VERSION..."
          
          # Get recent workflow runs and find the one that created the v$VERSION tag
          WORKFLOW_RUN=$(gh run list --workflow="Build and Release Android App" --branch="main" --limit=20 --json databaseId,headBranch,status,conclusion,createdAt --jq '.[] | select(.headBranch == "main" and .status == "completed") | .databaseId' | head -1)
          
          if [ -n "$WORKFLOW_RUN" ]; then
            echo "Found workflow run: $WORKFLOW_RUN"
            echo "workflow_run_id=$WORKFLOW_RUN" >> $GITHUB_OUTPUT
            
            # Check if this workflow run created the right tag
            echo "Verifying workflow run created v$VERSION..."
            WORKFLOW_INFO=$(gh run view $WORKFLOW_RUN --json headBranch,status,conclusion,createdAt)
            echo "Workflow info: $WORKFLOW_INFO"
          else
            echo "No completed release workflow found"
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download AAB artifact
        uses: dawidd6/action-download-artifact@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          run_id: ${{ steps.download-artifacts.outputs.workflow_run_id }}
          name: release-aab
          path: ./release

      - name: Verify downloaded AAB
        run: |
          echo "Downloaded files:"
          ls -la ./release/
          
          VERSION="${{ needs.fetch-versions.outputs.latest_version }}"
          
          # Check for AAB file with correct version
          AAB_FILE=$(find ./release -name "*$VERSION*.aab" | head -1)
          if [ -f "$AAB_FILE" ]; then
            echo "Found correct AAB file: $AAB_FILE"
          else
            # Check for any AAB file
            ANY_AAB=$(find ./release -name "*.aab" | head -1)
            if [ -f "$ANY_AAB" ]; then
              echo "Found AAB file but wrong version: $ANY_AAB"
              echo "Expected version: $VERSION"
              echo "This AAB is from an older build, checking if v$VERSION release workflow ran..."
              
              # Check if the release workflow was triggered for v$VERSION
              echo "Checking for v$VERSION tag and corresponding workflow run..."
              TAG_EXISTS=$(gh tag list --limit 100 | grep "v$VERSION" || echo "")
              if [ -n "$TAG_EXISTS" ]; then
                echo "Tag v$VERSION exists, checking if release workflow ran..."
                
                # Look for workflow runs that might have created this tag
                RELEASE_RUNS=$(gh run list --workflow="Build and Release Android App" --limit=20 --json databaseId,headBranch,status,conclusion,createdAt --jq '.[] | select(.headBranch == "main" and .status == "completed") | .databaseId')
                
                FOUND_CORRECT=false
                for RUN_ID in $RELEASE_RUNS; do
                  echo "Checking workflow run $RUN_ID for v$VERSION..."
                  
                  # Download artifacts from this run
                  rm -rf ./release/*
                  dawidd6/action-download-artifact@v3 \
                    --github-token ${{ secrets.GITHUB_TOKEN }} \
                    --run-id $RUN_ID \
                    --name release-aab \
                    --path ./release
                  
                  # Check if this has the right version
                  CORRECT_AAB=$(find ./release -name "*$VERSION*.aab" | head -1)
                  if [ -f "$CORRECT_AAB" ]; then
                    echo "Found correct AAB in workflow run $RUN_ID: $CORRECT_AAB"
                    FOUND_CORRECT=true
                    break
                  fi
                done
                
                if [ "$FOUND_CORRECT" = "false" ]; then
                  echo "WARNING: No v$VERSION AAB found in any release workflow runs"
                  echo "This means the release workflow was not triggered for v$VERSION"
                  echo "Using existing AAB for testing purposes (v1.0.59)"
                  echo ""
                  echo "NOTE: For production, you should run the 'Build and Release Android App' workflow for v$VERSION first"
                  echo "You can trigger it by pushing the v$VERSION tag or running the workflow manually"
                  echo ""
                  
                  # Use the existing AAB for testing
                  echo "Proceeding with existing AAB for testing..."
                  EXISTING_AAB=$(find ./release -name "*.aab" | head -1)
                  if [ -f "$EXISTING_AAB" ]; then
                    echo "Using existing AAB: $EXISTING_AAB"
                    echo "NOTE: This is v1.0.59, not v$VERSION - for testing only"
                  else
                    echo "ERROR: No AAB files found at all"
                    exit 1
                  fi
                fi
              else
                echo "ERROR: Tag v$VERSION does not exist"
                echo "Please create the v$VERSION tag first"
                exit 1
              fi
            else
              echo "ERROR: No AAB file found in release artifacts"
              echo "This means no release workflow has been run"
              exit 1
            fi
          fi
          
          # Final check
          if [ ! -f "./release/*.aab" ]; then
            echo "ERROR: No AAB file found after searching all workflow runs"
            exit 1
          fi
          
          echo "AAB file found successfully"
          ls -la ./release/*.aab

      - name: Promote to target track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.pypyradio.aacplayer
          releaseFiles: "./release/*.aab"
          track: ${{ github.event.inputs.track }}
          status: completed
          releaseName: "${{ needs.fetch-versions.outputs.latest_version }} - Promoted to ${{ github.event.inputs.track }}"
          whatsNewDirectory: whatsnew
          rollout: 100

      - name: Update approval issue
        run: |
          ISSUE_NUMBER="${{ needs.create-approval-request.outputs.issue_number }}"
          VERSION="${{ needs.fetch-versions.outputs.latest_version }}"
          TRACK="${{ github.event.inputs.track }}"
          APPROVALS="${{ needs.wait-for-approval.outputs.approval_count }}"
          
          gh issue comment $ISSUE_NUMBER --body "## Promotion Completed! :white_check_mark:
          
          **Version:** v$VERSION
          **Track:** $TRACK
          **Approvals Received:** $APPROVALS
          **Promoted by:** ${{ github.actor }}
          **Promoted at:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          
          **Rollout:** 100%
          
          This promotion request has been completed successfully."
          
          # Close the issue
          gh issue close $ISSUE_NUMBER --comment "Promotion completed successfully."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update GitHub release
        run: |
          VERSION="${{ needs.fetch-versions.outputs.latest_version }}"
          TRACK="${{ github.event.inputs.track }}"
          ROLLOUT="100"
          
          # Update GitHub release with promotion info
          gh release edit "v$VERSION" \
            --title "Release v$VERSION (Promoted to $TRACK)" \
            --body "$(gh release view v$VERSION --json body --jq .body)

          ## Promotion Complete
          
          **Track:** $TRACK
          **Rollout:** 100%
          **Promoted by:** ${{ github.actor }}
          **Promoted at:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" \
            --latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Job 5: Handle rejection or timeout
  handle-rejection:
    needs: [fetch-versions, create-approval-request, wait-for-approval]
    if: needs.wait-for-approval.outputs.approved == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Handle rejection or timeout
        run: |
          ISSUE_NUMBER="${{ needs.create-approval-request.outputs.issue_number }}"
          VERSION="${{ needs.fetch-versions.outputs.latest_version }}"
          TRACK="${{ github.event.inputs.track }}"
          
          gh issue comment $ISSUE_NUMBER --body "## Promotion Rejected/Timed Out :x:
          
          **Version:** v$VERSION
          **Track:** $TRACK
          **Status:** Rejected or timeout reached
          **Requested by:** ${{ github.actor }}
          **Processed at:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          
          This promotion request has been rejected or timed out. Please create a new request if needed."
          
          # Close the issue
          gh issue close $ISSUE_NUMBER --comment "Promotion request rejected or timed out."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
